"name":"淋浴间·独立隔间","info":"独立淋浴与干区更衣空间。","views":{"front":{"src":"assets/shower_interior-front-1801816bce.webp","width":1672,"height":941},"side":{"src":"assets/shower_interior-side-7885c2a424.webp","width":1672,"height":941},"back":{"src":"assets/shower_interior-back-6171c94f7e.webp","width":1672,"height":941}}},{"slug":"accessible_interior","name":"卫生间·无障碍设施","info":"无障碍设施概念示意，非规范验收图。","views":{"front":{"src":"assets/accessible_interior-front-e57461aeaa.webp","width":1672,"height":941},"side":{"src":"assets/accessible_interior-side-897afbb72d.webp","width":1672,"height":941},"back":{"src":"assets/accessible_interior-back-7a3000716a.webp","width":1672,"height":941}}},{"slug":"lakeside_walk","name":"湖畔步道·休闲近景","info":"沿湖步道、座椅与休闲亭。","views":{"front":{"src":"assets/lakeside_walk-front-d716f4975a.webp","width":1672,"height":941},"side":{"src":"assets/lakeside_walk-side-506b41b637.webp","width":1672,"height":941},"back":{"src":"assets/lakeside_walk-back-0b080f0d36.webp","width":1672,"height":941}}},{"slug":"camp_pad_detail","name":"车＋帐篷营位·细节近景","info":"营位地面、帐篷与水电设施的近景。","views":{"front":{"src":"assets/camp_pad_detail-front-cc2313819f.webp","width":1672,"height":941},"side":{"src":"assets/camp_pad_detail-side-a2c0119420.webp","width":1672,"height":941},"back":{"src":"assets/camp_pad_detail-back-3acff4df8e.webp","width":1672,"height":941}}}],names={front:'原正面',side:'侧向补全',back:'后向补全',right:'另一侧补全'};const $=s=>document.querySelector(s),image=$('#picture');let index=0,direction='side',token=0,loaded=false,auto=false,timer=null;
scenes.forEach((s,i)=>{const b=document.createElement('button');b.className='scene';b.textContent=`${i+1}. ${s.name}`;b.onclick=()=>show(i,direction);$('.scenes').append(b);});
function schedule(){clearTimeout(timer);timer=null;if(auto&&loaded&&!document.hidden)timer=setTimeout(()=>{const dirs=Object.keys(scenes[index].views),n=dirs.indexOf(direction);if(n===dirs.length-1)show((index+1)%scenes.length,dirs[0]);else show(index,dirs[n+1]);},6000);}
function show(i,d){index=(i+scenes.length)%scenes.length;direction=scenes[index].views[d]?d:'side';const s=scenes[index],v=s.views[direction],id=++token;loaded=false;schedule();$('.status').textContent='正在加载方向图…';$('#title').textContent=`${index+1} / 16 · ${s.name} · ${names[direction]}`;$('.info').textContent=`${s.info} · 原生 ${v.width}×${v.height} · ${direction==='front'?'原近景参考':'AI 补全区域'}`;$('#source').href=v.src;image.alt=s.name+' '+names[direction];document.querySelectorAll('.scene').forEach((b,k)=>b.classList.toggle('active',k===index));document.querySelectorAll('.angles button').forEach(b=>{b.hidden=!s.views[b.dataset.direction];b.classList.toggle('active',b.dataset.direction===direction);});const next=new Image();next.onload=()=>{if(id!==token)return;image.src=v.src;loaded=true;$('.status').textContent='';schedule();};next.onerror=()=>{if(id!==token)return;$('.status').textContent='图片加载失败，请重新选择方向';};next.src=v.src;}
document.querySelectorAll('.angles button').forEach(b=>{b.textContent=names[b.dataset.direction];b.onclick=()=>show(index,b.dataset.direction);});$('#prev').onclick=()=>show(index-1,direction);$('#next').onclick=()=>show(index+1,direction);$('#auto').onclick=()=>{auto=!auto;$('#auto').textContent=auto?'暂停查看':'自动查看方向';schedule();};document.addEventListener('visibilitychange',schedule);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(index+1,direction);if(e.key==='ArrowLeft')show(index-1,direction);});if(location.protocol==='file:'){const links=document.querySelectorAll('.top-links a');links[0].href='../expanded_scenes/index.html';links[1].href='../clean_light_panos/'+encodeURIComponent('灯光清理360离线试版.html');}show(0,'side');
