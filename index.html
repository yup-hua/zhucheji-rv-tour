 labelLayer.hidden=displayedScene!==5||detailMode;
 const tan=Math.tan(fov*Math.PI/360),aspect=innerWidth/innerHeight;
 const placed=[];
 facilityLabels.forEach(([name,u,v],i)=>{
  const lon=(u/1774-.5)*Math.PI*2,lat=(.5-v/887)*Math.PI;
  const dx=Math.sin(lon)*Math.cos(lat),dy=Math.sin(lat),dz=Math.cos(lon)*Math.cos(lat);
  const x=Math.cos(yaw)*dx-Math.sin(yaw)*dz,z0=Math.sin(yaw)*dx+Math.cos(yaw)*dz;
  const y=Math.cos(pitch)*dy+Math.sin(pitch)*z0,z=-Math.sin(pitch)*dy+Math.cos(pitch)*z0;
  const px=innerWidth/2*(1+x/(z*tan*aspect)),py=innerHeight/2*(1-y/(z*tan));
  const node=facilityNodes[i];
  const width=node.offsetWidth||100;
  const visible=z>.1&&px>width/2+8&&px<innerWidth-width/2-8&&py>170&&py<innerHeight-155;
  const overlap=placed.some(([x0,y0,w0])=>Math.abs(px-x0)<(width+w0)/2+8&&Math.abs(py-y0)<42);
  node.hidden=!visible||overlap;
  if(visible&&!overlap){node.style.left=px+'px';node.style.top=(py-22)+'px';placed.push([px,py,width]);}
 });
 requestAnimationFrame(updateFacilityLabels);
}
requestAnimationFrame(updateFacilityLabels);
