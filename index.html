const scenes=[{"name":"总览","slug":"overview","info":"驻车及房车自驾车友服务驿站整体规划：入口、复合营位、服务中心、共享厨房天幕区与快充区。","src":"true_panos_4k/overview.jpg?v=b8d500b1710e"},{"name":"入口门头","slug":"entrance","info":"浅蓝品牌精神堡垒、门岗和清晰的人车分流入口。","src":"true_panos_4k/entrance.jpg?v=cabf82e74d6e"},{"name":"车＋帐篷复合营位","slug":"parking","info":"建议单元约6.5m×5.0m，车辆旁预留帐篷或天幕空间，并设置水电接口。","src":"true_panos_4k/parking.jpg?v=641a9910ef78"},{"name":"共享厨房·天幕聚餐区","slug":"kitchen","info":"共享厨房、露营桌椅和大天幕共同构成开放聚餐交流区。","src":"true_panos_4k/kitchen.jpg?v=bc84c41f9080"},{"name":"快充区","slug":"charging","info":"6台直流快充桩配简洁开放式雨棚，充电区不设置集装箱。","src":"true_panos_4k/charging.jpg?v=18d473868a10"},{"name":"服务中心·驻车集超市","slug":"service","info":"服务接待、驻车集超市、卫生间、淋浴间、洗衣房、共享厨房与办公。","src":"true_panos_4k/service.jpg?v=14129e97545e"},{"name":"水电排污接口","slug":"hookups","info":"营位侧边集中配置饮用水、用电、灰水与黑水排放接口。","src":"true_panos_4k/hookups.jpg?v=c0a321a154bc"},{"name":"边缘配套","slug":"edge","info":"垃圾分类、应急信息、导视、照明、监控和绿化围挡。","src":"true_panos_4k/edge.jpg?v=82c76f2c8a96"}];const canvas=document.getElementById('vr');const gl=canvas.getContext('webgl',{antialias:true,alpha:false});const loading=document.getElementById('loading');
