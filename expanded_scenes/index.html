<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>驻车及房车自驾车友服务驿站｜16场景方案展示</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3f3;color:#173d49;font-family:"Microsoft YaHei","PingFang SC",sans-serif}header{background:#0c3545;color:white;padding:24px max(16px,5vw)}h1{font-size:25px;margin:0 0 10px;line-height:1.45}header p{margin:0;color:#cbe2e7;font-size:14px;line-height:1.7}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button,a.action{font:inherit;cursor:pointer;border:1px solid #24738b;border-radius:9px;padding:10px 16px;color:#133e4d;background:#fff;text-decoration:none}header button,header a{background:#176179!important;color:white!important;border-color:#448a9d!important}main{max-width:1660px;margin:auto;padding:24px 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{margin:0;background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 14px #14323d12;border:1px solid #d5e2e4}.card button{border:0;padding:0;display:block;width:100%;border-radius:0}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#dce7e8}.copy{padding:16px}.copy h2{font-size:18px;line-height:1.5;margin:0 0 8px}.copy p{font-size:14px;line-height:1.7;margin:0;color:#587079}.badge{font-size:12px;display:inline-block;border-radius:4px;background:#d9eef0;color:#165667;padding:3px 6px;margin-bottom:8px}.note{font-size:13px;line-height:1.8;margin:0 0 24px;color:#4e6b74}.viewer{position:fixed;inset:0;z-index:20;background:#071a23;display:flex;flex-direction:column;color:white}.viewer[hidden]{display:none}.viewer-head{padding:12px 18px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:#102e3a}.viewer h2{font-size:19px;margin:0}.viewer-body{flex:1;min-height:0;display:grid;place-items:center;position:relative}.viewer img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.viewer-foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.viewer-info{margin:0 </style></head><body><header><h1>驻车及房车自驾车友服务驿站</h1><p>16 个场景 · 原 8 个功能区完整保留 · 新增 8 个近景方案示意</p><nav><button id="start">自动浏览全部场景</button><button id="extras">查看新增场景</button><a class="action" href="../index.html?auto=1">返回 360°巡游</a></nav></header><main><p class="note">这里采用独立近景，避免将普通照片投到球面后拉伸、变形。图片为 AI 方案效果图，新增内景不代表已施工或已确定平面设计。点击图片可全屏查看，并打开原图；原生尺寸在查看器中显示，不冒充 4K。</p><div class="grid" id="grid"></div></main><section class="viewer" hidden aria-label="场景查看器"><div class="viewer-head"><h2 id="title"></h2><button id="close" aria-label="关闭查看器">关闭 ×</button></div><div class="viewer-body"><img id="large" alt=""><div id="status" class="status" role="status"></div></div><p class="viewer-info" id="info"></p><div class="viewer-foot"><button id="prev">上一场景</button><button id="auto">自动浏览</button><button id="next">下一场景</button><button id="full">全屏</button><a id="original" class="original" target="_blank" rel="noopener">查看原图</a></div></section><script>
const scenes=[{"slug":"overview","name":"整体规划总览","info":"入口、营位、生活服务与快充的整体方案。","src":"assets/overview-f2de096b9b.webp","thumb":"assets/overview-f2de096b9b-preview.webp","width":1672,"height":941,"new":false},{"slug":"entrance","name":"入口门头","info":"品牌门头、门岗与人车分流。","src":"assets/entrance-bd405f4ecd.webp","thumb":"assets/entrance-bd405f4ecd-preview.webp","width":1672,"height":941,"new":false},{"slug":"parking","name":"车＋帐篷复合营位","info":"房车与帐篷共同使用的营位空间。","src":"assets/parking-ddea9b69b1.webp","thumb":"assets/parking-ddea9b69b1-preview.webp","width":1672,"height":941,"new":false},{"slug":"kitchen","name":"共享厨房·天幕聚餐区","info":"开放聚餐与车友交流空间。","src":"assets/kitchen-f4c6c044fb.webp","thumb":"assets/kitchen-f4c6c044fb-preview.webp","width":1672,"height":941,"new":false},{"slug":"charging","name":"快充区","info":"开放雨棚下的车辆补能空间。","src":"assets/charging-dedf432f72.webp","thumb":"assets/charging-dedf432f72-preview.webp","width":1672,"height":941,"new":false},{"slug":"service","name":"综合服务中心","info":"卫生间、淋浴、洗衣、超市、厨房与接待。","src":"assets/service-3f67e82ff7.webp","thumb":"assets/service-3f67e82ff7-preview.webp","width":1672,"height":941,"new":false},{"slug":"hookups","name":"水电排污接口","info":"营位侧水、电、灰水与黑水接口方案。","src":"assets/hookups-ea7528c58a.webp","thumb":"assets/hookups-ea7528c58a-preview.webp","width":1672,"height":941,"new":false},{"slug":"edge","name":"边缘配套","info":"垃圾分类、应急信息、导视与休闲配套。","src":"assets/edge-583a36558a.webp","thumb":"assets/edge-583a36558a-preview.webp","width":1672,"height":941,"new":false},{"slug":"reception_interior","name":"综合服务中心·接待内景","info":"接待柜台、等候与资讯服务。","src":"assets/reception_interior-0f27e79b54.webp","thumb":"assets/reception_interior-0f27e79b54-preview.webp","width":1672,"height":941,"new":true},{"slug":"market_interior","name":"驻车集超市·补给内景","info":"日常补给、冷藏与收银动线。","src":"assets/market_interior-9106604d98.webp","thumb":"assets/market_interior-9106604d98-preview.webp","width":1672,"height":941,"new":true},{"slug":"laundry_interior","name":"洗衣房·洗烘内景","info":"洗烘设备、折衣台与洗涤池。","src":"assets/laundry_interior-05ba1969c9.webp","thumb":"assets/laundry_interior-05ba1969c9-preview.webp","width":1672,"height":941,"new":true},{"slug":"kitchen_interior","name":"共享厨房·操作内景","info":"备餐、水槽、灶具与排烟设施。","src":"assets/kitchen_interior-379492d63e.webp","thumb":"assets/kitchen_interior-379492d63e-preview.webp","width":1672,"height":941,"new":true},{"slug":"shower_interior","name":"淋浴间·独立隔间","info":"独立淋浴与干区更衣空间。","src":"assets/shower_interior-1801816bce.webp","thumb":"assets/shower_interior-1801816bce-preview.webp","width":1672,"height":941,"new":true},{"slug":"accessible_interior","name":"卫生间·无障碍设施","info":"无障碍设施概念示意，非规范验收图。","src":"assets/accessible_interior-e57461aeaa.webp","thumb":"assets/accessible_interior-e57461aeaa-preview.webp","width":1672,"height":941,"new":true},{"slug":"lakeside_walk","name":"湖畔步道·休闲近景","info":"沿湖步道、座椅与休闲亭。","src":"assets/lakeside_walk-d716f4975a.webp","thumb":"assets/lakeside_walk-d716f4975a-preview.webp","width":1672,"height":941,"new":true},{"slug":"camp_pad_detail","name":"车＋帐篷营位·细节近景","info":"营位地面、帐篷与水电设施的近景。","src":"assets/camp_pad_detail-cc2313819f.webp","thumb":"assets/camp_pad_detail-cc2313819f-preview.webp","width":1672,"height":941,"new":true}];const $=s=>document.querySelector(s),viewer=$('.viewer'),image=$('#large');let index=0,auto=false,timer=null,token=0,loaded=false,lastFocus=null;
scenes.forEach((s,i)=>{const card=document.createElement('article');card.className='card';card.id='scene-'+i;const b=document.createElement('button');b.setAttribute('aria-label','查看 '+s.name);const im=document.createElement('img');im.src=s.thumb;im.alt=s.name;im.loading=i<3?'eager':'lazy';im.decoding='async';b.append(im);b.onclick=()=>open(i);const copy=document.createElement('div');copy.className='copy';if(s.new){const badge=document.createElement('span');badge.className='badge';badge.textContent='新增近景 · 方案示意';copy.append(badge);}const h=document.createElement('h2');h.textContent=(i+1).toString().padStart(2,'0')+' / '+s.name;const p=document.createElement('p');p.textContent=s.info;copy.append(h,p);card.append(b,copy);$('#grid').append(card);});
function schedule(){clearTimeout(timer);if(auto&&loaded&&!viewer.hidden)timer=setTimeout(()=>show((index+1)%scenes.length),6500);}
function setAuto(value){auto=value;$('#auto').textContent=auto?'暂停浏览':'自动浏览';schedule();}
function show(i){index=(i+scenes.length)%scenes.length;const s=scenes[index],id=++token;loaded=false;clearTimeout(timer);$('#title').textContent=`${index+1} / ${scenes.length} · ${s.name}`;$('#info').textContent=s.info+` · 原生 ${s.width}×${s.height}`;$('#original').href=s.src;$('#status').textContent='正在加载近景…';image.alt=s.name;image.src=s.thumb;const high=new Image();high.onload=()=>{if(id!==token)return;image.src=s.src;loaded=true;$('#status').textContent='';schedule();};high.onerror=()=>{if(id!==token)return;$('#status').textContent='原图加载失败，保留预览；可切换后重试';loaded=true;schedule();};high.src=s.src;}
function open(i){lastFocus=document.activeElement;viewer.hidden=false;document.body.style.overflow='hidden';show(i);$('#close').focus();}
function close(){++token;setAuto(false);if(document.fullscreenElement===viewer)document.exitFullscreen?.();viewer.hidden=true;document.body.style.overflow='';lastFocus?.focus();}
$('#close').onclick=close;$('#prev').onclick=()=>show(index-1);$('#next').onclick=()=>show(index+1);$('#auto').onclick=()=>setAuto(!auto);$('#start').onclick=()=>{open(0);setAuto(true)};$('#extras').onclick=()=>$('#scene-8').scrollIntoView({behavior:'smooth',block:'start'});$('#full').onclick=()=>viewer.requestFullscreen?.();
document.addEventListener('keydown',e=>{if(viewer.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1);if(e.key==='Tab'){const focusable=[...viewer.querySelectorAll('button,a')];if(e.shiftKey&&document.activeElement===focusable[0]){e.preventDefault();focusable.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===focusable.at(-1)){e.preventDefault();focusable[0].focus();}}});
if(location.protocol==='file:')document.querySelector('a.action').href='../clean_light_panos/'+encodeURIComponent('灯光清理360离线试版.html');
let touchX=null;image.addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});image.addEventListener('touchend',e=>{if(touchX===null)return;const delta=e.changedTouches[0].clientX-touchX;if(Math.abs(delta)>60)show(index+(delta<0?1:-1));touchX=null;},{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else schedule();});
</script></body></html>
